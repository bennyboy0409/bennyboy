# Veröffentlicht die Island-Roadtrip-Karte als GitHub-Pages-Seite.
# Läuft bei jedem Push auf den Karten-Branch — der Link bleibt gleich,
# der Inhalt aktualisiert sich.
name: Karte auf GitHub Pages

# Nur main: die github-pages-Umgebung lässt ohnehin nur den
# Default-Branch deployen, alles andere schlüge dort auf.
on:
  push:
    branches: [main]
    paths: ['island-roadtrip/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          # Einstieg ist die Satellitenkarte; fällt bei fehlendem Internet
          # selbst auf karte.html (Offline-Karte) zurück
          cp island-roadtrip/karte-google-maps.html _site/index.html
          cp island-roadtrip/karte-google-maps.html _site/karte-google-maps.html
          cp island-roadtrip/karte.html _site/karte.html

      - name: Eingeschraenkten Maps-Schluessel einsetzen
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY"
          # index.html IST die Satellitenkarte — beide Kopien patchen,
          # sonst liefert die Startseite den Platzhalter aus
          python - <<'PY'
          from pathlib import Path
          import os
          key = os.environ['GOOGLE_MAPS_API_KEY']
          placeholder = 'HIER_DEINEN_KEY_EINSETZEN'
          patched = 0
          for name in ('index.html', 'karte-google-maps.html'):
              p = Path('_site')/name
              text = p.read_text(encoding='utf-8')
              if placeholder in text:
                  p.write_text(text.replace(placeholder, key), encoding='utf-8')
                  patched += 1
          assert patched == 2, f'Platzhalter nur in {patched} von 2 Dateien gefunden'
          PY

      - name: Pages aktivieren (falls noch nie eingeschaltet)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

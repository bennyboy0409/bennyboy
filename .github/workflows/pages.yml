# Veröffentlicht die Island-Roadtrip-Karte als GitHub-Pages-Seite.
# Läuft bei jedem Push auf den Karten-Branch — der Link bleibt gleich,
# der Inhalt aktualisiert sich.
name: Karte auf GitHub Pages

# Nur main: die github-pages-Umgebung lässt ohnehin nur den
# Default-Branch deployen, alles andere schlüge dort auf.
on:
  push:
    branches: [main]
    paths: ['island-roadtrip/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp island-roadtrip/karte.html _site/index.html
          # zusätzlich unter eigenem Namen, damit der "← Offline-Karte"-Link
          # der Satellitenseite auf Pages UND bei lokalen Dateien funktioniert
          cp island-roadtrip/karte.html _site/karte.html
          cp island-roadtrip/karte-google-maps.html _site/karte-google-maps.html

      - name: Eingeschraenkten Maps-Schluessel einsetzen
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY"
          python -c "from pathlib import Path; import os; p = Path('_site/karte-google-maps.html'); placeholder = 'HIER_DEINEN_KEY_EINSETZEN'; text = p.read_text(encoding='utf-8'); assert placeholder in text, 'Maps-Key-Platzhalter fehlt'; p.write_text(text.replace(placeholder, os.environ['GOOGLE_MAPS_API_KEY']), encoding='utf-8')"

      - name: Pages aktivieren (falls noch nie eingeschaltet)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
